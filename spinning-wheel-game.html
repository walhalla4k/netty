<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>원반돌리기 게임</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #f472b6;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", "Malgun Gothic", -apple-system, sans-serif;
    background: radial-gradient(circle at top, #1e293b, var(--bg));
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px;
  }
  .wrap {
    width: 100%;
    max-width: 900px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  h1 {
    text-align: center;
    margin: 0;
    font-size: 1.8rem;
    letter-spacing: 1px;
  }
  h1 .emoji { filter: drop-shadow(0 0 6px var(--accent)); }
  .layout {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    align-items: flex-start;
    justify-content: center;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    flex: 1 1 300px;
    min-width: 280px;
  }

  /* Wheel */
  .wheel-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    flex: 1 1 360px;
  }
  .wheel-area {
    position: relative;
    width: min(360px, 80vw);
    height: min(360px, 80vw);
  }
  #wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 0 8px var(--panel-2), 0 12px 40px rgba(0,0,0,0.5);
    display: block;
  }
  .pointer {
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 30px solid var(--accent-2);
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
    z-index: 5;
  }
  .hub {
    position: absolute;
    top: 50%; left: 50%;
    width: 54px; height: 54px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 35%, #fff, #cbd5e1 60%, #94a3b8);
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    z-index: 4;
  }
  .result {
    min-height: 28px;
    font-size: 1.25rem;
    font-weight: 700;
    text-align: center;
    color: var(--accent);
  }

  /* Controls */
  label { display: block; font-size: 0.9rem; color: var(--muted); margin-bottom: 6px; }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
  select, input[type="text"] {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 0.95rem;
    width: 100%;
  }
  input[type="text"]:focus, select:focus { outline: 2px solid var(--accent); }
  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .swatch {
    width: 20px; height: 20px;
    border-radius: 5px;
    flex-shrink: 0;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .buttons { display: flex; gap: 12px; margin-top: 8px; }
  button {
    flex: 1;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.05s, filter 0.15s;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #spinBtn { background: linear-gradient(135deg, var(--accent), #0ea5e9); color: #04263b; }
  #resetBtn { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  #spinBtn:hover:not(:disabled), #resetBtn:hover:not(:disabled) { filter: brightness(1.1); }
  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; line-height: 1.4; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="emoji">🎯</span> 원반돌리기 게임</h1>
  <div class="layout">
    <!-- Wheel -->
    <div class="panel wheel-panel">
      <div class="wheel-area">
        <div class="pointer"></div>
        <canvas id="wheel" width="600" height="600"></canvas>
        <div class="hub"></div>
      </div>
      <div class="result" id="result">시작 버튼을 눌러주세요</div>
      <div class="buttons">
        <button id="spinBtn">▶ 시작</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="panel">
      <div class="row">
        <div style="flex:1">
          <label for="count">옵션 개수 (3 ~ 8)</label>
          <select id="count">
            <option value="3">3개</option>
            <option value="4">4개</option>
            <option value="5">5개</option>
            <option value="6">6개</option>
            <option value="7">7개</option>
            <option value="8">8개</option>
          </select>
        </div>
      </div>
      <label>옵션 내용</label>
      <div id="options"></div>
      <div class="buttons">
        <button id="resetBtn">↺ 초기화</button>
      </div>
      <p class="hint">
        설정한 옵션 개수·내용은 자동 저장되어 페이지를 닫았다 다시 열어도 유지됩니다.
        초기화 버튼을 누르면 기본값으로 되돌아갑니다.
      </p>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "spinning-wheel-settings-v1";
  var COLORS = [
    "#ef4444", "#f97316", "#eab308", "#22c55e",
    "#06b6d4", "#3b82f6", "#8b5cf6", "#ec4899"
  ];

  var canvas = document.getElementById("wheel");
  var ctx = canvas.getContext("2d");
  var countSel = document.getElementById("count");
  var optionsBox = document.getElementById("options");
  var spinBtn = document.getElementById("spinBtn");
  var resetBtn = document.getElementById("resetBtn");
  var resultEl = document.getElementById("result");

  // ----- State -----
  var state = loadSettings();
  var currentAngle = 0;      // 현재 원반 회전 각도(라디안), 종료 후 유지됨
  var spinning = false;

  function defaultSettings() {
    return { count: 6, labels: ["옵션 1", "옵션 2", "옵션 3", "옵션 4", "옵션 5", "옵션 6"] };
  }

  function loadSettings() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultSettings();
      var s = JSON.parse(raw);
      if (!s || typeof s.count !== "number" || !Array.isArray(s.labels)) {
        return defaultSettings();
      }
      s.count = Math.min(8, Math.max(3, s.count));
      // 개수에 맞춰 라벨 배열 정규화
      s.labels = normalizeLabels(s.labels, s.count);
      return s;
    } catch (e) {
      return defaultSettings();
    }
  }

  function normalizeLabels(labels, count) {
    var out = labels.slice(0, count);
    for (var i = out.length; i < count; i++) out.push("옵션 " + (i + 1));
    return out;
  }

  function saveSettings() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* 저장 실패 무시 */ }
  }

  // ----- UI 렌더링 -----
  function renderControls() {
    countSel.value = String(state.count);
    optionsBox.innerHTML = "";
    for (var i = 0; i < state.count; i++) {
      (function (idx) {
        var row = document.createElement("div");
        row.className = "option-row";

        var sw = document.createElement("span");
        sw.className = "swatch";
        sw.style.background = COLORS[idx % COLORS.length];

        var input = document.createElement("input");
        input.type = "text";
        input.value = state.labels[idx];
        input.maxLength = 20;
        input.setAttribute("aria-label", "옵션 " + (idx + 1));
        input.addEventListener("input", function () {
          state.labels[idx] = input.value;
          saveSettings();
          drawWheel();
        });

        row.appendChild(sw);
        row.appendChild(input);
        optionsBox.appendChild(row);
      })(i);
    }
  }

  // ----- 원반 그리기 -----
  function drawWheel() {
    var n = state.count;
    var size = canvas.width;
    var cx = size / 2, cy = size / 2, r = size / 2 - 4;
    var seg = (2 * Math.PI) / n;

    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(currentAngle);

    for (var i = 0; i < n; i++) {
      var start = i * seg;
      var end = start + seg;

      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, start, end);
      ctx.closePath();
      ctx.fillStyle = COLORS[i % COLORS.length];
      ctx.fill();
      ctx.lineWidth = 3;
      ctx.strokeStyle = "rgba(255,255,255,0.25)";
      ctx.stroke();

      // 텍스트
      ctx.save();
      ctx.rotate(start + seg / 2);
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold " + Math.max(16, Math.min(30, 200 / n)) + "px 'Malgun Gothic', sans-serif";
      ctx.shadowColor = "rgba(0,0,0,0.4)";
      ctx.shadowBlur = 4;
      var label = (state.labels[i] || "").trim() || ("옵션 " + (i + 1));
      ctx.fillText(truncate(label, 10), r - 20, 0);
      ctx.restore();
    }
    ctx.restore();
  }

  function truncate(str, max) {
    return str.length > max ? str.slice(0, max - 1) + "…" : str;
  }

  // ----- 넓은 분포의 랜덤 (암호학적 균등 분포) -----
  function uniformInt(n) {
    // crypto가 있으면 편향 없는 균등 정수, 없으면 Math.random 대체
    if (window.crypto && window.crypto.getRandomValues) {
      var limit = Math.floor(0xffffffff / n) * n; // 모듈로 편향 제거
      var buf = new Uint32Array(1);
      var x;
      do {
        window.crypto.getRandomValues(buf);
        x = buf[0];
      } while (x >= limit);
      return x % n;
    }
    return Math.floor(Math.random() * n);
  }

  function uniformFloat() {
    if (window.crypto && window.crypto.getRandomValues) {
      var buf = new Uint32Array(1);
      window.crypto.getRandomValues(buf);
      return buf[0] / 0x100000000;
    }
    return Math.random();
  }

  // ----- 스핀 -----
  function spin() {
    if (spinning) return;
    spinning = true;
    spinBtn.disabled = true;
    resultEl.textContent = "돌리는 중...";

    var n = state.count;
    var seg = (2 * Math.PI) / n;

    // 균등 분포로 당첨 인덱스 선택 (넓은 분포)
    var winner = uniformInt(n);

    // 포인터는 12시(위쪽) 방향. 캔버스 0라디안은 3시 방향이므로 보정.
    // 당첨 조각의 중앙이 12시에 오도록 목표 각도 계산 + 조각 내 랜덤 오프셋.
    var pointerAngle = -Math.PI / 2; // 12시
    var jitter = (uniformFloat() - 0.5) * seg * 0.7; // 조각 안에서 살짝 랜덤
    var winnerCenter = winner * seg + seg / 2;
    // 목표: (currentAngle + winnerCenter) 를 pointerAngle 위치로
    var targetMod = pointerAngle - winnerCenter - jitter;

    // currentAngle 에서부터 여러 바퀴 더 돌려 targetMod 로 도달
    var turns = 5 + uniformInt(3); // 5~7바퀴
    var twoPi = 2 * Math.PI;
    var base = currentAngle;
    // base 를 기준으로 targetMod 와 같은 나머지가 되도록 델타 계산
    var delta = ((targetMod - base) % twoPi + twoPi) % twoPi + turns * twoPi;

    var startAngle = currentAngle;
    var duration = 4200 + uniformFloat() * 1200; // 4.2~5.4초
    var startTime = null;

    function easeOutQuart(t) { return 1 - Math.pow(1 - t, 4); } // 처음 빠르고 끝 느리게

    function frame(ts) {
      if (startTime === null) startTime = ts;
      var elapsed = ts - startTime;
      var t = Math.min(1, elapsed / duration);
      currentAngle = startAngle + delta * easeOutQuart(t);
      drawWheel();

      if (t < 1) {
        requestAnimationFrame(frame);
      } else {
        currentAngle = ((startAngle + delta) % twoPi + twoPi) % twoPi; // 정규화하여 유지
        drawWheel();
        spinning = false;
        spinBtn.disabled = false;
        var label = (state.labels[winner] || "").trim() || ("옵션 " + (winner + 1));
        resultEl.textContent = "🎉 결과: " + label;
      }
    }
    requestAnimationFrame(frame);
  }

  // ----- 이벤트 -----
  countSel.addEventListener("change", function () {
    state.count = parseInt(countSel.value, 10);
    state.labels = normalizeLabels(state.labels, state.count);
    saveSettings();
    renderControls();
    drawWheel();
  });

  spinBtn.addEventListener("click", spin);

  resetBtn.addEventListener("click", function () {
    if (spinning) return;
    state = defaultSettings();
    saveSettings();
    currentAngle = 0;
    resultEl.textContent = "시작 버튼을 눌러주세요";
    renderControls();
    drawWheel();
  });

  // ----- 초기화 -----
  renderControls();
  drawWheel();
})();
</script>
</body>
</html>
